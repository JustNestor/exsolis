[package]
name = "exsolis_client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "exsolis"
path = "src/main.rs"

[dependencies]
exsolis_common.workspace = true
exsolis_server.workspace = true
fastpack.workspace = true
reqwest.workspace = true

bevy_app.workspace = true
bevy_math = "0.19"
bevy_ecs.workspace = true
bevy_asset.workspace = true
bevy_input.workspace = true
bevy_window.workspace = true
bevy_winit.workspace = true
bevy_time.workspace = true
bevy_transform.workspace = true
bevy_tasks.workspace = true
bevy_log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
bevy_a11y.workspace = true
bevy_diagnostic.workspace = true
bevy_renet.workspace = true
bevy_internal.workspace = true
roxmltree.workspace = true
bevy_color.workspace = true
bevy_text.workspace = true
bevy_picking.workspace = true
bevy_image.workspace = true
bevy_ui.workspace = true
bevy_camera.workspace = true
wgpu-types.workspace = true
bevy_ui_widgets.workspace = true


glam.workspace = true
image.workspace = true
winit.workspace = true
vulkano.workspace = true
vulkano-macros.workspace = true
vulkano-shaders.workspace = true
vulkano-taskgraph.workspace = true
naga.workspace = true
serde_json.workspace = true
serde.workspace = true

mimalloc.workspace = true
rand.workspace = true
bincode.workspace = true
offset-allocator.workspace = true

# `utils` gates `Animation::reader`; `guess_mime_type` lets the importer
# recognise formats beyond PNG/JPEG (girl.glb's texture is WebP, and without
# this the whole model fails to load with "unsupported image encoding").
# `image023` turns on the matching WebP decoder — the `gltf` crate pulls
# image 0.23, a different major from the `image` the client uses directly.
gltf = { version = "0.16", features = ["image", "utils", "guess_mime_type"] }
image023.workspace = true
gltf-json = "0.16"

thiserror = { version = "2.0", default-features = false }
fixedbitset = "0.5"

# taffy = "0.14.0"

[features]
tracy = ["dep:tracing-tracy"]
