[package]
name = "exsolis_server"
version = "0.1.0"
edition = "2024"

# [lib]
# name = "exsolis_server"
# path = "src/lib.rs"

[[bin]]
name = "exsolis_server_bin"
path = "src/main.rs"

[dependencies]
exsolis_common.workspace = true
fastpack.workspace = true
tesjit-dwarf.workspace = true
tesjit.workspace = true
axum.workspace = true
bytes.workspace = true
tokio.workspace = true

bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_time.workspace = true
bevy_transform.workspace = true
bevy_tasks.workspace = true
bevy_log.workspace = true
bevy_diagnostic.workspace = true
bevy_renet.workspace = true

glam.workspace = true
# Decoding embedded GLB textures at catalog build time; see
# `gltf_pack::normalize_glb_textures`.
image = { workspace = true }
rand.workspace = true
rayon.workspace = true
opensimplex2 = { workspace = true, optional = true }
smallvec.workspace = true
rustc-hash.workspace = true
bincode.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
mlua.workspace = true

mimalloc = { workspace = true, optional = true }

# Server-only bevy deps (no winit/window)
bevy_internal = { version = "0.19", features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_image",
    "bevy_log",
    "bevy_picking",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_input_focus"
], default-features = false }


[features]
default = []
standalone = ["dep:mimalloc"]
advanced_worldgen = ["opensimplex2"]
