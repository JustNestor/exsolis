[package]
name = "tesjit"
version = "0.1.0"
edition = "2024"
description = "Minimal statically-typed TypeScript → Cranelift JIT, embeddable."

[lib]
name = "tesjit"
path = "src/lib.rs"

[[bin]]
name = "tesjit"
path = "src/bin/tesjit.rs"

[dependencies]
thiserror = "2.0.21"
oxc_allocator = "0.152"
oxc_parser = "0.152"
oxc_ast = "0.152"
oxc_span = "0.152"
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-jit = "0.136"
miette = { version = "7.6.0", features = ["fancy"] }
cranelift-native = "0.136.1"

[dev-dependencies]
tesjit-dwarf = { path = "../tesjit-dwarf" }
