[workspace]
members = ["common", "server", "client", "crates/fastpak", "crates/tesjit", "crates/tesjit-dwarf"]
resolver = "2"

[workspace.dependencies]
exsolis_common = { path = "common" }
exsolis_server = { path = "server" }
bevy_app = "0.19"
bevy_ecs = { version = "0.19", features = ["bevy_debug_stepping", "debug"] }
bevy_reflect = "0.19"
bevy_log = "0.19"
bevy_time = "0.19"
bevy_transform = "0.19"
bevy_tasks = "0.19"
bevy_diagnostic = "0.19"
bevy_renet = "5.0"
bevy_asset = "0.19"
bevy_input = "0.19"
bevy_input_focus = "0.19"
bevy_window = "0.19"
bevy_winit = "0.19"
bevy_a11y = "0.19"
# bevy_ui = "0.19"
roxmltree = "0.20"
bevy_color = "0.19"
bevy_text = {version = "0.19", features = ["default_font"]}
bevy_ui = { version = "0.19", features = ["bevy_picking", "ghost_nodes"] }
bevy_ui_widgets = "0.19"
# bevy_image = "0.19"
bevy_image = {version="0.19", features=["webp"]}
wgpu-types = "29.0.4"
bevy_camera = "0.19.1"

offset-allocator = "0.2.0"
glam = "0.32.1"
smallvec = "1.15.2"
rustc-hash = "2.1.3"
rand = "0.10.2"
rayon = "1.12.0"
opensimplex2 = "1.1.0"
mlua = { version = "*", features = ["luajit", "vendored"] }
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
bincode = "=1.3.3"
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

winit = "0.30.13"
# `webp` is required by `assets/models/girl.glb`, whose single texture is
# WebP-encoded; without it the avatar silently fails to load.
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
# The `gltf` crate decodes embedded textures through image 0.23, a different
# major version from the one above, so WebP support has to be enabled on both
# — cargo unifies features per version, not per crate name.
image023 = { package = "image", version = "0.23", default-features = false, features = ["webp"] }
vulkano = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-macros = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-shaders = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-taskgraph = { git = "https://github.com/vulkano-rs/vulkano" }
# bevy_internal = "0.19"
bevy_internal = { version = "0.19", features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_image",
    "bevy_log",
    "bevy_picking",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus"
] }
mimalloc = "0.1.52"
bevy_picking ="0.19"
naga = {version="30.0.1", features = ["spv-out", "wgsl-in"]}
zrip = "0.8.11"
fastpack = { package = "fastpak", path = "./crates/fastpak" }
tesjit-dwarf = { path = "./crates/tesjit-dwarf" }
tesjit = { path = "./crates/tesjit" }


# [workspace.dependencies.bevy_mod_scripting]
# version = "0.20"
# default-features = false
# features = [
#     "luajit",
#     "lua",
#     "unsafe_lua_modules",
#     "core_functions",
#     "bevy_ecs_bindings"
# ]

[profile.dev]
opt-level = 1
# `debug = 2` (full) rather than "line-tables-only": the type database that the
# mod bridge loads (`cargo run -p tesjit-dwarf -- target/debug/exsolis_server_bin`)
# reads struct layouts out of DWARF, and line tables carry none.
debug = 2
# NOTE: rustc's dev default on this toolchain is split-DWARF, which puts every
# real type in a sibling `.dwo` file next to the binary. `just export-types`
# therefore points the exporter at both the binary and that directory (see
# crates/tesjit-dwarf), so this stays at the toolchain default.
split-debuginfo = "unpacked"
lto = false

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3
