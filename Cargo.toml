[workspace]
members = ["common", "server", "client"]
resolver = "2"

[workspace.dependencies]
exsolis_common = { path = "common" }
exsolis_server = { path = "server" }
bevy_app = "0.19"
bevy_ecs = { version = "0.19", features = ["bevy_debug_stepping", "debug"] }
bevy_reflect = "0.19"
bevy_log = "0.19"
bevy_time = "0.19"
bevy_transform = "0.19"
bevy_tasks = "0.19"
bevy_diagnostic = "0.19"
bevy_renet = "5.0"
glam = "0.30.10"
smallvec = "1.15.2"
rustc-hash = "2.1.3"

rand = "0.10.2"
rayon = "1.12.0"
opensimplex2 = "1.1.0"
mlua = { version = "*", features = ["luajit", "vendored"] }
serde = {version = "1.0.229", features = ["derive"]}
bincode = "=1.3.3"

bevy_asset = "0.19"
bevy_input = "0.19"
bevy_window = "0.19"
bevy_winit = "0.19"
bevy_a11y = "0.19"
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
vulkano = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-macros = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-shaders = { git = "https://github.com/vulkano-rs/vulkano" }
vulkano-taskgraph = { git = "https://github.com/vulkano-rs/vulkano" }
bevy_internal = "0.19"

mimalloc = "0.1.52"

# [workspace.dependencies.bevy_mod_scripting]
# version = "0.20"
# default-features = false
# features = [
#     "luajit",
#     "lua",
#     "unsafe_lua_modules",
#     "core_functions",
#     "bevy_ecs_bindings"
# ]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
lto = false

[profile.dev.package."*"]
opt-level = 3
debug = true
